    <rect x="983" y="134" width="119" height="42" rx="10" stroke="#65F4C7" fill="#0A111D"/>
    <text x="994" y="160" fill="#F7FAFF" font-weight="700">VERIFIER</text>
    <path d="M944 155H983" stroke="#65F4C7" stroke-width="2.5"/>
    <path d="M963 149L971 155L963 161" stroke="#65F4C7" fill="none" stroke-width="2"/>
    <path d="M1042 176V202H958V224" stroke="#65F4C7" stroke-opacity=".7" stroke-width="2" fill="none"/>
    <rect x="879" y="224" width="161" height="41" rx="10" fill="#65F4C7" fill-opacity=".11" stroke="#65F4C7"/>
    <text x="895" y="250" fill="#F7FAFF" font-weight="700">HUMAN REVIEW</text>
    <circle cx="1102" cy="98" r="4" fill="#65F4C7"/>
    <circle cx="1086" cy="98" r="4" fill="#294056"/>
    <circle cx="1070" cy="98" r="4" fill="#294056"/>
