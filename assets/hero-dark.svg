<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-label="Akhilesh Vangala, AI Engineer at NYU Courant">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#65F4C7" stop-opacity=".2"/>
      <stop offset="1" stop-color="#65F4C7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nyuGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#57068C" stop-opacity=".35"/>
      <stop offset="1" stop-color="#57068C" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#294056" stroke-opacity=".35" stroke-width=".5"/>
    </pattern>
  </defs>
  <rect width="1200" height="380" rx="24" fill="#0A111D"/>
  <rect x="3" y="3" width="1194" height="374" rx="21" fill="none" stroke="#294056" stroke-width="2"/>
  <rect width="1200" height="380" fill="url(#grid)" opacity=".22" rx="24"/>
  <rect x="0" y="0" width="520" height="380" fill="url(#nyuGlow)" rx="24"/>
  <circle cx="1040" cy="150" r="220" fill="url(#glow)"/>

  <!-- NYU Courant chip -->
  <g transform="translate(56,36)">
    <rect width="168" height="36" rx="10" fill="#57068C"/>
    <g fill="#FFFFFF" transform="translate(10,6) scale(0.55)">
      <path d="M14 2c2.2 4.2 1.4 7.2-.2 9.2 2.6.4 4.6 2.4 4.6 5.3 0 3.2-2.4 5.5-6.2 5.5S6 19.7 6 16.5c0-2.8 1.8-4.7 4.2-5.3C8.4 9 7.8 6.2 10 2c1.2 1.8 2.4 2.6 4 0z"/>
      <rect x="11.2" y="22" width="5.6" height="12" rx="1"/>
    </g>
    <text x="36" y="24" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="1.2">NYU COURANT</text>
  </g>

  <!-- NYU CDS chip -->
  <g transform="translate(236,36)">
    <rect width="210" height="36" rx="10" fill="#57068C"/>
    <text x="14" y="24" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="0.8">NYU DATA SCIENCE</text>
  </g>

  <g font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
    <circle cx="65" cy="108" r="5" fill="#65F4C7"/>
    <text x="82" y="113" font-size="16" font-weight="700" fill="#8EA6BC" letter-spacing="3.5">AI ENGINEERING / M.S. DATA SCIENCE</text>
    <text x="56" y="178" font-size="62" font-weight="800" fill="#F7FAFF" letter-spacing="-2.2">Akhilesh Vangala</text>
    <text x="58" y="226" font-size="22" font-weight="500" fill="#B4C1D5">Building AI systems that survive real-world constraints.</text>
    <g font-size="14" font-weight="700" letter-spacing="1">
