      <text x="80" y="288" fill="#F7FAFF">LLM AGENTS</text>
      <rect x="218" y="262" width="140" height="40" rx="12" fill="#111F2F" stroke="#294056"/>
      <text x="240" y="288" fill="#F7FAFF">EVALUATION</text>
      <rect x="370" y="262" width="168" height="40" rx="12" fill="#111F2F" stroke="#294056"/>
      <text x="392" y="288" fill="#F7FAFF">BACKEND / ML</text>
    </g>
  </g>

  <g font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="15">
