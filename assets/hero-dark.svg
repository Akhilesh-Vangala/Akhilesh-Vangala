    <text x="821" y="110" fill="#8EA6BC" letter-spacing="2.2" font-weight="700">SYSTEM RELIABILITY</text>
    <rect x="824" y="134" width="120" height="42" rx="10" stroke="#294056" fill="#0A111D"/>
