<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --a: #2EE6A6; --b: #5CE1FF; }
    body { width: 600px; height: 270px; overflow: hidden; background: transparent; font-family: "IBM Plex Sans", system-ui, sans-serif; }
    .card {
      width: 600px; height: 270px; position: relative; border-radius: 22px; overflow: hidden;
      background: #070b16;
    }
    .card::before {
      content: ""; position: absolute; inset: 0; padding: 1.5px; border-radius: 22px; z-index: 3;
      background: linear-gradient(135deg, var(--a), var(--b) 55%, rgba(255,255,255,0.08));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      pointer-events: none;
    }
    .aurora {
      position: absolute; inset: -30%;
      background:
        radial-gradient(ellipse 40% 50% at 18% 18%, color-mix(in srgb, var(--a) 46%, transparent), transparent 62%),
        radial-gradient(ellipse 42% 55% at 92% 85%, color-mix(in srgb, var(--b) 40%, transparent), transparent 60%);
    }
    .mesh {
      position: absolute; inset: 0; opacity: 0.22;
      background-image:
        linear-gradient(rgba(255,255,255,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.07) 1px, transparent 1px);
      background-size: 30px 30px;
      mask-image: radial-gradient(ellipse 70% 70% at 70% 40%, #000 10%, transparent 75%);
    }
    .top-bar { position: absolute; top: 0; left: 0; right: 0; height: 4px; z-index: 2; background: linear-gradient(90deg, var(--a), var(--b)); }
    .content { position: relative; z-index: 2; padding: 26px 28px 22px; height: 100%; display: flex; flex-direction: column; }
    .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .kicker {
      display: flex; align-items: center; gap: 9px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #c4d4e8;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff, var(--a) 50%);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--a) 20%, transparent), 0 0 14px var(--a);
    }
    .num {
      font-family: "Space Grotesk", sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.1em;
      padding: 5px 10px; border-radius: 999px; color: #f8fafc;
      border: 1px solid color-mix(in srgb, var(--b) 50%, transparent);
      background: color-mix(in srgb, var(--b) 12%, transparent);
    }
    h1 {
      font-family: "Space Grotesk", sans-serif; font-size: 38px; font-weight: 700;
      letter-spacing: -0.04em; line-height: 1; margin-bottom: 8px;
      background: linear-gradient(100deg, #ffffff 15%, color-mix(in srgb, var(--a) 55%, #fff) 60%, color-mix(in srgb, var(--b) 70%, #fff) 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      padding-bottom: 2px;
    }
    .blurb { font-size: 15px; color: #d0dbea; font-weight: 500; margin-bottom: 18px; }
    .flow { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; gap: 8px; align-items: center; margin-bottom: auto; }
    .node {
      height: 50px; border-radius: 13px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px;
      font-family: "Space Grotesk", sans-serif; font-size: 13px; font-weight: 700; color: #f8fafc;
      border: 1px solid rgba(255,255,255,0.12); background: rgba(3,7,18,0.6);
    }
    .node span { font-size: 9.5px; letter-spacing: 0.14em; color: #94a3b8; font-weight: 650; }
    .node.n1 { border-color: color-mix(in srgb, var(--a) 60%, transparent); box-shadow: 0 0 22px color-mix(in srgb, var(--a) 14%, transparent); }
    .node.n2 { border-color: color-mix(in srgb, var(--a) 40%, var(--b)); background: color-mix(in srgb, var(--b) 7%, rgba(3,7,18,0.6)); }
    .node.n3 { border-color: color-mix(in srgb, var(--b) 70%, transparent); background: color-mix(in srgb, var(--b) 10%, rgba(3,7,18,0.6)); box-shadow: 0 0 22px color-mix(in srgb, var(--b) 16%, transparent); }
    .arrow { font-weight: 700; font-size: 16px; }
    .arrow.a1 { color: var(--a); text-shadow: 0 0 10px var(--a); }
    .arrow.a2 { color: var(--b); text-shadow: 0 0 10px var(--b); }
    .stack { display: flex; flex-wrap: wrap; gap: 7px; }
    .tag {
      font-size: 11.5px; font-weight: 600; color: #e2e8f0; padding: 5px 10px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="aurora"></div>
    <div class="mesh"></div>
    <div class="top-bar"></div>
    <div class="content">
      <div class="head">
        <div class="kicker"><span class="dot"></span><span id="kicker">Selected system</span></div>
        <div class="num" id="num">01</div>
      </div>
      <h1 id="title">Title</h1>
      <p class="blurb" id="blurb">Blurb</p>
      <div class="flow" id="flow"></div>
      <div class="stack" id="stack"></div>
    </div>
  </div>
  <script>
    const p = new URLSearchParams(location.search);
    document.documentElement.style.setProperty("--a", p.get("a") || "#2EE6A6");
    document.documentElement.style.setProperty("--b", p.get("b") || "#5CE1FF");
    document.getElementById("title").textContent = p.get("title") || "";
    document.getElementById("blurb").textContent = p.get("blurb") || "";
    document.getElementById("kicker").textContent = p.get("kicker") || "Selected system";
    document.getElementById("num").textContent = p.get("num") || "01";
    const flow = document.getElementById("flow");
    (p.get("steps") || "A|B|C").split("|").forEach((s, i, arr) => {
      const n = document.createElement("div");
      n.className = `node n${i + 1}`;
      n.innerHTML = `<span>0${i + 1}</span>${s}`;
      flow.appendChild(n);
      if (i < arr.length - 1) {
        const a = document.createElement("div");
        a.className = `arrow a${i + 1}`;
        a.textContent = "→";
        flow.appendChild(a);
      }
    });
    const stack = document.getElementById("stack");
    (p.get("stack") || "").split("|").filter(Boolean).forEach((t) => {
      const el = document.createElement("span");
      el.className = "tag";
      el.textContent = t;
      stack.appendChild(el);
    });
  </script>
</body>
</html>
