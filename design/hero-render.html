<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1200px; height: 248px; overflow: hidden; background: #0d1117; }
    .hero {
      width: 1200px; height: 248px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 40px 48px;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .kicker {
      font-size: 13px; font-weight: 600; letter-spacing: 0.14em;
      text-transform: uppercase; color: #8b949e; margin-bottom: 12px;
    }
    h1 {
      font-size: 44px; font-weight: 600; letter-spacing: -0.03em;
      color: #f0f6fc; line-height: 1.1; margin-bottom: 10px;
    }
    .role { font-size: 20px; font-weight: 500; color: #c9d1d9; margin-bottom: 6px; }
    .meta { font-size: 16px; color: #8b949e; line-height: 1.45; }
  </style>
</head>
<body>
  <div class="hero">
    <p class="kicker">AI Engineer</p>
    <h1>Akhilesh Vangala</h1>
    <p class="role">MS Data Science, New York University</p>
    <p class="meta">Courant Institute of Mathematics, Computing, and Data Science · New York City Metropolitan Area</p>
  </div>
</body>
</html>
